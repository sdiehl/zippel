[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
categories = ["algorithms", "mathematics"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/tiny-zippel"

[workspace.dependencies]
groebner = { version = "0.3", default-features = false }
insta = { version = "1.41", features = ["glob"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1.10"
zippel-interp = { path = "crates/interp", version = "0.1.0" }
zippel-lift = { path = "crates/lift", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
