[package]
name = "tiny-zippel"
version = "0.1.0"
authors = ["Stephen Diehl <stephen.m.diehl@gmail.com>"]
categories = ["algorithms", "mathematics"]
edition = "2021"
keywords = ["polynomial", "gcd", "zippel", "algebra"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/sdiehl/tiny-zippel"
description = "Sparse multivariate polynomial GCD by Zippel's modular interpolation."

[dependencies]
groebner = { version = "0.3", default-features = false }
num-bigint = "0.5"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
insta = { version = "1.41", features = ["glob"] }

[[example]]
name = "demo"
path = "examples/demo.rs"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
